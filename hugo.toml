baseURL = "https://oldvan.top/"
languageCode = "zh-cn"
title = "老梵"
theme = "LoveIt"
paginate = 8
hasCJKLanguage = true
defaultContentLanguage = "zh-cn"
disablePathToLower = true

[languages.zh-cn.menu]
  [[languages.zh-cn.menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[languages.zh-cn.menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20
  [[languages.zh-cn.menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30
  [[languages.zh-cn.menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

[params]
  mainSections = ["posts"]
  defaultTheme = "auto"
  enableEmoji = true

  [params.author]
    name = "老梵"
    email = ""
    link = ""

  [params.pageViews]
    enabled = true
    label = "阅读量"
    namespace = "oldvan-top"
    endpoint = "https://oldvan-page-views.vanvjvanvj.workers.dev"

  [params.comments]
    enabled = true
    provider = "giscus"

    [params.comments.giscus]
      repo = "vanvj00001/oldvan"
      repoID = "R_kgDORe3TgA"
      category = "General"
      categoryID = "DIC_kwDORe3TgM4C4_S_"
      mapping = "pathname"
      strict = "0"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      theme = "preferred_color_scheme"
      lang = "zh-CN"

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "输入关键词..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2

  [params.footer]
    enable = true
    custom = ""
    hugo = true
    copyright = true
    author = true
    since = 2022
    icp = '<a href="https://beian.miit.gov.cn/" target="_blank">苏ICP备2026013379号-1</a>'
  [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.png"
      title = "老梵"
      subtitle = "个人随笔空间"
      typeit = false
      social = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
